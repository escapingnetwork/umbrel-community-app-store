version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: escaping-network-simplex-relay_web_1
      APP_PORT: "8080"
      PROXY_AUTH_ADD: "false"

  smp:
    image: simplexchat/smp-server:latest
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/smp/config:/etc/opt/simplex
      - ${APP_DATA_DIR}/smp/state:/var/opt/simplex

  xftp:
    image: simplexchat/xftp-server:latest
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/xftp/config:/etc/opt/simplex-xftp
      - ${APP_DATA_DIR}/xftp/state:/var/opt/simplex-xftp
      - ${APP_DATA_DIR}/xftp/files:/srv/xftp

  web:
    # === PUBLISHED IMAGE VERSION (recommended for Umbrel) ===
    # After the GitHub Actions workflow succeeds, update this line:
    image: ghcr.io/escapingnetwork/simplex-relay-dashboard:latest
    # image: ghcr.io/escapingnetwork/simplex-relay-dashboard:sha-xxxxxxx@sha256:...

    # === BUILD VERSION (only use for local development/testing) ===
    # build:
    #   context: ./dashboard
    #   dockerfile: Dockerfile

    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/smp/config:/etc/opt/simplex
      - ${APP_DATA_DIR}/smp/state:/var/opt/simplex
      - ${APP_DATA_DIR}/xftp/config:/etc/opt/simplex-xftp
      - ${APP_DATA_DIR}/xftp/state:/var/opt/simplex-xftp
      - ${APP_DATA_DIR}/xftp/files:/srv/xftp
    environment:
      PORT: 8080
    depends_on:
      - smp
      - xftp
