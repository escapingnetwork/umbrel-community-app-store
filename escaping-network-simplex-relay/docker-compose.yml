version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: web
      APP_PORT: "8080"
      PROXY_AUTH_ADD: "false"

  smp:
    image: simplexchat/smp-server:latest
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # IMPORTANT: Set this to your Tailscale MagicDNS name (e.g. umbrel.yourname.ts.net)
      # or your public domain. This is required for the SMP server to generate its address.
      ADDR: ${ADDR:-change-me-to-your-tailscale-name.ts.net}
    volumes:
      - ${APP_DATA_DIR}/smp/config:/etc/opt/simplex
      - ${APP_DATA_DIR}/smp/state:/var/opt/simplex

  xftp:
    image: simplexchat/xftp-server:latest
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # IMPORTANT: Set this to your Tailscale MagicDNS name (same as SMP)
      ADDR: ${ADDR:-change-me-to-your-tailscale-name.ts.net}
      # Storage quota for the XFTP server (e.g. 10gb, 50gb)
      QUOTA: ${QUOTA:-10gb}
      # Optional password to allow uploading new files (leave empty to allow without password)
      PASS: ${PASS:-}
    volumes:
      - ${APP_DATA_DIR}/xftp/config:/etc/opt/simplex-xftp
      - ${APP_DATA_DIR}/xftp/state:/var/opt/simplex-xftp
      - ${APP_DATA_DIR}/xftp/files:/srv/xftp

  web:
    # Fully pinned digest from GitHub Actions (multi-arch)
    image: ghcr.io/escapingnetwork/simplex-relay-dashboard@sha256:95c0cfbf353c0186528c24d0bc425734763e724392a56e2ee9aa889afe9d0de4

    # Optional: tag + digest form for readability
    # image: ghcr.io/escapingnetwork/simplex-relay-dashboard:sha-XXXX@sha256:95c0cfbf353c0186528c24d0bc425734763e724392a56e2ee9aa889afe9d0de4

    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/smp/config:/etc/opt/simplex
      - ${APP_DATA_DIR}/smp/state:/var/opt/simplex
      - ${APP_DATA_DIR}/xftp/config:/etc/opt/simplex-xftp
      - ${APP_DATA_DIR}/xftp/state:/var/opt/simplex-xftp
      - ${APP_DATA_DIR}/xftp/files:/srv/xftp
    environment:
      PORT: 8080
    depends_on:
      - smp
      - xftp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
