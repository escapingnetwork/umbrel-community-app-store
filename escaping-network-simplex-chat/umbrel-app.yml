manifestVersion: 1
id: escaping-network-simplex-chat
category: developer
name: SimpleX Gateway
version: "0.1.2"
tagline: Headless SimpleX Chat daemon for Hermes Agent and bots
description: >-
  Runs SimpleX Chat as a private, headless daemon with the official JSON WebSocket API exposed on the internal Docker network.

  Designed as the messaging gateway for Hermes Agent (Nous Research) running on Umbrel Home, but works with any bot or automation that speaks the SimpleX Chat bot protocol.

  Features:
  - Automatic bot profile creation ("Hermes Gateway")
  - Files allowed
  - WebSocket JSON API reachable by other Umbrel apps (ws://escaping-network-simplex-chat_app_1:5225)
  - Clean web dashboard with connection instructions
  - Persistent encrypted database

  SimpleX provides state-of-the-art metadata resistance — no phone numbers, emails, or persistent user IDs.

releaseNotes: >-
  0.1.2: Dashboard now available immediately (even during first-boot daemon init).

  - Web server on :8080 is started right after container start so the Umbrel "Open"
    button and app_proxy no longer get "connection refused" while the simplex-chat
    daemon does first-time bot profile creation or recovers from transient crashes.
  - Fixed DB detection for simplex-chat v6.5.3+ (now looks for simplex_chat.db /
    simplex_agent.db instead of the old simplex_v1_chat.db name). This prevents
    repeated create attempts against the wrong data directory.
  - More logging around daemon restarts ("divide by zero" etc.).

  0.1.1: Robust gateway fixes...
  (see previous release notes for the socat/hostname work)

