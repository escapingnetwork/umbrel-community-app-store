version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: escaping-network-simplex-chat_app_1
      APP_PORT: "8080"
      PROXY_AUTH_ADD: "false"

  app:
    # Fully pinned digest from GitHub Actions (multi-arch).
    image: ghcr.io/escapingnetwork/simplex-chat-daemon@sha256:0269457ef58aa78bea10d9db289622a730b0aedd419234ab3e01aa4d4c826c57

    # Optional: tag + digest form (the sha- tag from the workflow run for this commit)
    # image: ghcr.io/escapingnetwork/simplex-chat-daemon:sha-0aad184@sha256:0269457ef58aa78bea10d9db289622a730b0aedd419234ab3e01aa4d4c826c57

    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SIMPLEX_DATA_DIR: /data
