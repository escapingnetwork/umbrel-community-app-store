version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: "8080"
      PROXY_AUTH_ADD: "false"

  app:
    # Fully pinned digest from GitHub Actions (multi-arch build after 6.5.3 + robust entrypoint)
    image: ghcr.io/escapingnetwork/simplex-chat-daemon@sha256:1ed4ada9f0348e45dcd5da4d6632df0a4d34e1d90a1d2f7c26cb2d2ed61e1bfe

    # Optional: tag + digest form (the sha- tag from the workflow run)
    # image: ghcr.io/escapingnetwork/simplex-chat-daemon:sha-XXXX@sha256:1ed4ada9f0348e45dcd5da4d6632df0a4d34e1d90a1d2f7c26cb2d2ed61e1bfe

    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SIMPLEX_DATA_DIR: /data
