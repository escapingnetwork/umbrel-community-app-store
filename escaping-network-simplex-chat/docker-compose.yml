version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: escaping-network-simplex-chat_app_1
      APP_PORT: "8080"
      PROXY_AUTH_ADD: "false"

  app:
    # === PUBLISHED IMAGE VERSION (recommended) ===
    # After running the GitHub Actions workflow, replace this with the actual digest
    image: ghcr.io/escapingnetwork/simplex-chat-daemon:latest
    # image: ghcr.io/escapingnetwork/simplex-chat-daemon:sha-abc1234@sha256:...

    # === BUILD VERSION (only for local development) ===
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SIMPLEX_DATA_DIR: /data
