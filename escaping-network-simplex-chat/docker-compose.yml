version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: "8080"
      PROXY_AUTH_ADD: "false"

  app:
    # Published by GitHub Actions (multi-arch)
    # After the next workflow run (6.5.3 binary + robust entrypoint), update this tag.
    image: ghcr.io/escapingnetwork/simplex-chat-daemon:sha-672a656

    # For maximum reproducibility, pin the full digest.
    # Go to https://github.com/escapingnetwork/packages/container/simplex-chat-daemon
    # → Click the tag → Copy the full digest and use:
    # image: ghcr.io/escapingnetwork/simplex-chat-daemon:sha-XXXXXX@sha256:full-digest-here

    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SIMPLEX_DATA_DIR: /data
