version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: escaping-network-simplex-chat_app_1
      APP_PORT: "8080"
      PROXY_AUTH_ADD: "false"

  app:
    # Fully pinned digest from GitHub Actions (multi-arch). New robust entrypoint for reliable socat WS gateway proxy.
    image: ghcr.io/escapingnetwork/simplex-chat-daemon@sha256:6b2c49e09e3e87929b44257c726d2d959208e55a48562965e9f62f072a7e6035

    # Optional: tag + digest form (the sha- tag from the workflow run for this commit)
    # image: ghcr.io/escapingnetwork/simplex-chat-daemon:sha-fa3522a@sha256:6b2c49e09e3e87929b44257c726d2d959208e55a48562965e9f62f072a7e6035

    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SIMPLEX_DATA_DIR: /data
