version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: escaping-network-simplex-chat_app_1
      APP_PORT: "8080"
      PROXY_AUTH_ADD: "false"

  app:
    # Fully pinned digest from GitHub Actions (multi-arch build after robust entrypoint v2).
    image: ghcr.io/escapingnetwork/simplex-chat-daemon@sha256:e2d9ed6bb04d0d85bcc4a308e5ca880e8cbd60071fd0dd24b6173d9546546281

    # Optional: tag + digest form (the sha- tag from the workflow run for this commit)
    # image: ghcr.io/escapingnetwork/simplex-chat-daemon:sha-a70ce4a@sha256:e2d9ed6bb04d0d85bcc4a308e5ca880e8cbd60071fd0dd24b6173d9546546281

    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SIMPLEX_DATA_DIR: /data
