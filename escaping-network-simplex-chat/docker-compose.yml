version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: escaping-network-simplex-chat_app_1
      APP_PORT: "8080"
      PROXY_AUTH_ADD: "false"

  app:
    # Fully pinned digest from GitHub Actions (multi-arch).
    image: ghcr.io/escapingnetwork/simplex-chat-daemon@sha256:5eefec1cad493fbf4c32133dd63ecdebc0f369e9b1f58500f0c7852e7c109c46

    # Optional: tag + digest form (the sha- tag from the workflow run for this commit)
    # image: ghcr.io/escapingnetwork/simplex-chat-daemon:sha-XXXX@sha256:5eefec1cad493fbf4c32133dd63ecdebc0f369e9b1f58500f0c7852e7c109c46

    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SIMPLEX_DATA_DIR: /data
