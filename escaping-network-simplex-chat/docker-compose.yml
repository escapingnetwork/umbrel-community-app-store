version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: escaping-network-simplex-chat_app_1
      APP_PORT: "8080"
      PROXY_AUTH_ADD: "false"

  app:
    # Fully pinned digest from GitHub Actions (multi-arch).
    image: ghcr.io/escapingnetwork/simplex-chat-daemon@sha256:5afc250803d7142f55177a6e3219f79bf765ad89b9a78178472ab341361812e0

    # Optional: tag + digest form (the sha- tag from the workflow run for this commit)
    # image: ghcr.io/escapingnetwork/simplex-chat-daemon:sha-8709bb9@sha256:5afc250803d7142f55177a6e3219f79bf765ad89b9a78178472ab341361812e0

    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SIMPLEX_DATA_DIR: /data
