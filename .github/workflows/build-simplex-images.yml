name: Build & Push SimpleX Images

on:
  push:
    branches: [master, main]
    paths:
      - 'escaping-network-simplex-relay/dashboard/**'
      - 'escaping-network-simplex-chat/Dockerfile'
      - 'escaping-network-simplex-chat/entrypoint.sh'
      - '.github/workflows/build-simplex-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: escapingnetwork

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            chat:
              - 'escaping-network-simplex-chat/Dockerfile'
              - 'escaping-network-simplex-chat/entrypoint.sh'
              - '.github/workflows/build-simplex-images.yml'
            relay:
              - 'escaping-network-simplex-relay/dashboard/**'
              - '.github/workflows/build-simplex-images.yml'

      - name: Build dynamic matrix
        id: matrix
        run: |
          MATRIX="[]"

          if [[ "${{ steps.filter.outputs.chat }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MATRIX=$(echo "$MATRIX" | jq '. += [{
              "name": "simplex-chat-daemon",
              "context": "escaping-network-simplex-chat",
              "dockerfile": "escaping-network-simplex-chat/Dockerfile",
              "image": "ghcr.io/escapingnetwork/simplex-chat-daemon"
            }]')
          fi

          if [[ "${{ steps.filter.outputs.relay }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MATRIX=$(echo "$MATRIX" | jq '. += [{
              "name": "simplex-relay-dashboard",
              "context": "escaping-network-simplex-relay/dashboard",
              "dockerfile": "escaping-network-simplex-relay/dashboard/Dockerfile",
              "image": "ghcr.io/escapingnetwork/simplex-relay-dashboard"
            }]')
          fi

          echo "include=$(echo "$MATRIX" | jq -c .)" >> $GITHUB_OUTPUT

  build-and-push:
    needs: changes
    if: needs.changes.outputs.include != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.include) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
